site_name: Minshawi
site_url: https://minsh4wi.github.io/
site_author: Mahmoud Sayed
site_description: Reverse Engineering, Malware Analysis, CTF Writeups, and Binary Research.

theme:
  name: material
  logo: material/minshawi.jpg
  favicon: material/minshawi.jpg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md

  - Reverse Engineering:
      - Assembly:
          - Bomb Lab: reverse-engineering/assembly/bomb-lab.md
          - Data Structures:
              - Recursion in Assembly: reverse-engineering/assembly/data-structures/recursion-in-assembly.md
              - Linked Lists in Assembly: reverse-engineering/assembly/data-structures/linked-lists-in-assembly.md

  - Malware Analysis:
      - Practical Malware Analysis Labs:
          - Lab 1: malware-analysis/pma/lab-1.md

  - CTF Writeups:
      - Latest CTFs: ctf/latest.md

plugins:
  - search
  - tags
  - glightbox

extra_css:
  - css/custom.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/minsh4wi
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/minshawi/
      name: LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/minsh4wi
      name: X (Twitter)
